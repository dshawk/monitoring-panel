name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: syntax and shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python3 -m py_compile app.py

      - name: Shell syntax
        run: |
          bash -n helper.sh
          bash -n cert-check.sh

      - name: ShellCheck
        run: shellcheck --severity=warning helper.sh cert-check.sh
